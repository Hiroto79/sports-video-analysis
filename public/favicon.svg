<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.3" />

  <!-- Monitor Screen Frame -->
  <rect x="76" y="96" width="360" height="250" rx="36" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="16" filter="url(#glow)" />
  
  <!-- Screen Glow / Grid line -->
  <line x1="76" y1="220" x2="436" y2="220" stroke="#10b981" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 8" />

  <!-- Analytics Stats Bars / Play Pulse inside screen -->
  <g transform="translate(116, 150)">
    <!-- Waveform / Stat Bars -->
    <rect x="20" y="70" width="22" height="45" rx="11" fill="#059669" opacity="0.8" />
    <rect x="56" y="45" width="22" height="70" rx="11" fill="#10b981" />
    <rect x="92" y="20" width="22" height="95" rx="11" fill="#34d399" />
    <rect x="128" y="55" width="22" height="60" rx="11" fill="#10b981" />
    
    <!-- Modern Play Triangle Arrow Badge -->
    <polygon points="190,30 260,70 190,110" fill="url(#emeraldGrad)" />
    <circle cx="190" cy="30" r="6" fill="#6ee7b7" />
    <circle cx="260" cy="70" r="6" fill="#6ee7b7" />
    <circle cx="190" cy="110" r="6" fill="#6ee7b7" />
  </g>

  <!-- Monitor Stand Base -->
  <path d="M220 346 L210 400 L160 416 C150 420 155 432 166 432 L346 432 C357 432 362 420 352 416 L302 400 L292 346 Z" fill="url(#emeraldGrad)" opacity="0.9" />
</svg>